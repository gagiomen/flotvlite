<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flo Lite TV 5.0 • Panou Admin Licențe</title>
  <style>
    :root { --bg:#0b111e; --card:#131d31; --border:#243554; --cyan:#00e5ff; --green:#22c55e; --red:#ef4444; --text:#f8fafc; --muted:#94a3b8; }
    * { box-sizing:border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin:0; background:var(--bg); color:var(--text); padding:20px; }
    .container { max-width:1100px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
    .header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; overflow:auto; }
    h1, h2 { margin:0 0 10px; }
    h1 span { color:var(--cyan); }
    input, button { padding:9px 12px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:#fff; font-size:13px; }
    button { background:var(--cyan); color:#04101d; font-weight:700; border:none; cursor:pointer; }
    button.sec { background:#1e293b; color:#fff; border:1px solid var(--border); }
    button.ok { background:var(--green); color:#04140a; }
    button.danger { background:var(--red); color:#fff; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th, td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--border); white-space:nowrap; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; }
    .badge { padding:3px 8px; border-radius:999px; font-size:11px; font-weight:700; }
    .b-active { background:rgba(34,197,94,0.18); color:#86efac; }
    .b-pending { background:rgba(245,158,11,0.2); color:#fde68a; }
    .b-exp { background:rgba(239,68,68,0.18); color:#fca5a5; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .hidden { display:none !important; }
    .dash-stack { display:flex; flex-direction:column; gap:18px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Flo Lite <span>TV 5.0</span> • Admin Licențe & Plăți</h1>
      <div class="row">
        <input id="admin-key" type="password" placeholder="ADMIN_SECRET">
        <button id="btn-login">Încarcă Date</button>
      </div>
    </div>

    <div id="dash" class="hidden dash-stack">
      <div class="card">
        <h2>💳 Plăți (PayPal / Revolut / Vouchere)</h2>
        <table>
          <thead><tr><th>Data</th><th>Cod TV</th><th>Metodă</th><th>Sumă</th><th>Status</th><th>Notă</th><th>Acțiune</th></tr></thead>
          <tbody id="tb-payments"></tbody>
        </table>
      </div>

      <div class="card">
        <h2>📺 Dispozitive & Licențe (<span id="lic-count">0</span>)</h2>
        <table>
          <thead><tr><th>Cod Scurt</th><th>Device ID</th><th>Status</th><th>Expiră la</th><th>Văzut</th><th>Acțiuni</th></tr></thead>
          <tbody id="tb-licenses"></tbody>
        </table>
      </div>

      <div class="card">
        <div class="header">
          <h2>🎟️ Coduri de Activare (Vouchere 30 zile)</h2>
          <div class="row">
            <input id="gen-count" type="number" value="5" min="1" max="50" style="width:75px;">
            <input id="gen-days" type="number" value="30" min="1" max="365" style="width:75px;">
            <button id="btn-gen-codes">Generează Coduri</button>
          </div>
        </div>
        <table>
          <thead><tr><th>Cod Voucher</th><th>Zile</th><th>Status</th><th>Creat</th></tr></thead>
          <tbody id="tb-codes"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/admin.js" defer></script>
</body>
</html>
